name: ci
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./... -cover
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
